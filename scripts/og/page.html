<!doctype html>
<meta charset="utf-8" />
<title>StoneQR Open Graph cards</title>
<style>
	/* One variable family: the card sets its width with ctx.fontStretch. */
	@font-face {
		font-family: 'OG Archivo';
		src: url('/archivo.woff2') format('woff2-variations');
		font-weight: 100 900;
		font-stretch: 62% 125%;
	}
	body {
		margin: 0;
		padding: 24px;
		background: #0b0d0e;
		color: #ebe6db;
		font: 14px ui-monospace, monospace;
		display: grid;
		gap: 16px;
		justify-items: center;
	}
	canvas {
		width: 600px;
		height: 315px;
		box-shadow: 0 2px 12px #0008;
	}
</style>
<body>
	<p id="status">Drawing…</p>
	<script type="module">
		import { CARD, drawCard } from '/card.js';

		const status = document.getElementById('status');
		const cards = await fetch('/cards.json').then((r) => r.json());
		await Promise.all(
			['expanded 800 46px', '400 24px', 'expanded 600 14px'].map((f) => document.fonts.load(`${f} "OG Archivo"`))
		);
		await document.fonts.ready;

		for (const card of cards) {
			const canvas = document.createElement('canvas');
			canvas.width = CARD.width;
			canvas.height = CARD.height;
			drawCard(canvas.getContext('2d'), card);
			document.body.append(canvas);
			const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
			await fetch(`/save/${card.slug || 'home'}`, { method: 'POST', body: blob });
			status.textContent = `Wrote ${card.slug}.png`;
		}
		status.textContent = `Done: ${cards.length} images written. You can close this tab.`;
	</script>
</body>
